[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clockbind"
version = "1.4.0"
description = "ClockBind: reproducible statistics studio for doctoral research — screening, descriptive and inferential statistics, regression with cluster-robust inference, reliability, factor analysis, overlap weighting and conjoint analysis, which-clock-binds verdicts and workbook validation, with provenance, validation against R and a local MCP server for chat apps."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Seyed Mehdi Alavi"}]
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "statsmodels", "openpyxl", "matplotlib", "python-docx", "tabulate", "reportlab>=3.6", "pypdf>=3", "sympy>=1.12"]

[project.urls]
Homepage = "https://github.com/malavi-ai/clockbind"
Source = "https://github.com/malavi-ai/clockbind"

[project.optional-dependencies]
spss = ["pyreadstat"]
studio = ["streamlit"]
mcp = ["mcp>=1.2,<2; python_version >= '3.10'"]
test = ["pytest", "mcp>=1.2,<2; python_version >= '3.10'"]
all = ["pyreadstat", "streamlit", "pytest", "mcp>=1.2,<2; python_version >= '3.10'"]

[project.scripts]
clockbind = "clockbind.cli:main"
phdstat = "clockbind.cli:main"
clockbind-mcp = "clockbind.mcp_server:main"

[tool.setuptools.packages.find]
include = ["clockbind*"]

[tool.setuptools.package-data]
clockbind = ["r/*.R", "studio/*.py", "studio/.streamlit/*", "assets/*", "assets/fonts/*", "data/*"]
